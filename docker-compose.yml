version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OCEANICOS_DB=/data/oceanicos.db
      - OCEANICOS_WORKSPACE=/data/workspace
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - oceanic-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  oceanic-data:
