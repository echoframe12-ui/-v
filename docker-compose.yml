# Ω∞v Oceanicos — Container Compose
# "Support LOCAL, CONTAINER, CLOUD, EDGE without changing the verification contract." — FORMLESS.md §XXII

version: '3.9'

services:
  # ─── Core Verification API ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: omega-v-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      API_PORT: '3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - omega-v-net

  # ─── Dashboard (Web) ─────────────────────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: omega-v-web
    ports:
      - '8080:80'
    volumes:
      - ./dist/assets:/usr/share/nginx/html/assets:ro
      - ./dist/index.html:/usr/share/nginx/html/index.html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - omega-v-net
    restart: unless-stopped

networks:
  omega-v-net:
    name: omega-v-network
    driver: bridge
