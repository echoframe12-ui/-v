name: Full Stack MOOD

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Full test suite
        run: make test
      - name: Live full-stack MOOD verification
        run: |
          make verify 2>&1 | tee mood-verification.txt
      - name: Build container
        run: make docker-build
      - name: Publish verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mood-verification-proof
          path: mood-verification.txt
          if-no-files-found: warn
